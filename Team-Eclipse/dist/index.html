<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070910">
  <meta name="description" content="SpriteLab - a retro pixel art studio in your browser.">
  <link rel="icon" type="image/png" href="./src/assets/Black and White Circular Art & Design Logo (1).png">
  <title>SpriteLab · Retro Pixel Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <script>
    // Apply the saved theme before paint so there is no flash of the wrong theme.
    (function () {
      try {
        if (JSON.parse(localStorage.getItem("pixel-forge:theme:v1")) === "light") {
          document.documentElement.dataset.theme = "light";
        }
      } catch (error) {
        /* Ignore storage access issues and keep the dark default. */
      }
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript>
    <p style="padding:24px;font-family:monospace">SpriteLab needs JavaScript enabled to run the editor.</p>
  </noscript>
  <script src="./app.js" defer></script>
</body>
</html>
